<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-label="">
  <title>Digital Balochistan horizon</title>
  <defs>
    <!-- Brand glows -->
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2fd08a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2fd08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1fb4c4" stop-opacity=".40"/>
      <stop offset="1" stop-color="#1fb4c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b35cf0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#b35cf0" stop-opacity="0"/>
    </radialGradient>

    <!-- Ridge fills: solid at the base, fading into the page at the crest -->
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd08a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2fd08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb4c4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#1fb4c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d6b45" stop-opacity=".40"/>
      <stop offset="1" stop-color="#0d6b45" stop-opacity=".04"/>
    </linearGradient>

    <!-- Crest highlights -->
    <linearGradient id="edgeGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd08a" stop-opacity="0"/>
      <stop offset=".45" stop-color="#2fd08a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f3a93a" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="edgeTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb4c4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#1fb4c4" stop-opacity="0"/>
    </linearGradient>

    <!-- Data grid that fades out towards the top -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#2fd08a"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask">
      <rect x="0" y="330" width="1200" height="570" fill="url(#dotFade)"/>
    </mask>

    <!-- Signal arc sweeping over the ridges -->
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd08a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2fd08a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2fd08a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Atmosphere -->
  <circle cx="930" cy="250" r="330" fill="url(#glowGreen)"/>
  <circle cx="330" cy="420" r="300" fill="url(#glowViolet)"/>
  <circle cx="650" cy="560" r="360" fill="url(#glowTeal)"/>

  <!-- Orbit rings: the "network" the portal connects people through -->
  <g stroke="#2fd08a" fill="none" opacity=".16">
    <circle cx="930" cy="250" r="150"/>
    <circle cx="930" cy="250" r="235" stroke-dasharray="3 9"/>
    <circle cx="930" cy="250" r="320" opacity=".6"/>
  </g>

  <!-- Data grid over the valley floor -->
  <g mask="url(#dotMask)" opacity=".30">
    <rect x="0" y="330" width="1200" height="570" fill="url(#dots)"/>
  </g>

  <!-- Horizon ridges: Balochistan's terrain, drawn as a signal trace -->
  <path d="M0 612 L150 556 L268 596 L392 498 L520 566 L652 470 L790 548 L910 486 L1046 552 L1200 500 V900 H0 Z" fill="url(#ridgeFar)"/>
  <path d="M0 612 L150 556 L268 596 L392 498 L520 566 L652 470 L790 548 L910 486 L1046 552 L1200 500"
        stroke="url(#edgeGreen)" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M0 724 L128 666 L246 710 L372 622 L498 690 L628 608 L764 680 L892 624 L1032 686 L1200 626 V900 H0 Z" fill="url(#ridgeMid)"/>
  <path d="M0 724 L128 666 L246 710 L372 622 L498 690 L628 608 L764 680 L892 624 L1032 686 L1200 626"
        stroke="url(#edgeTeal)" stroke-width="2" stroke-linejoin="round"/>

  <path d="M0 828 L140 782 L286 818 L420 742 L560 802 L700 736 L838 796 L980 744 L1120 798 L1200 770 V900 H0 Z" fill="url(#ridgeNear)"/>

  <!-- Peak markers: opportunities on the horizon -->
  <g fill="#2fd08a">
    <circle cx="392" cy="498" r="5"/>
    <circle cx="652" cy="470" r="6.5"/>
    <circle cx="910" cy="486" r="5"/>
  </g>
  <g stroke="#2fd08a" stroke-width="1.2" opacity=".45">
    <path d="M392 498 V330"/>
    <path d="M652 470 V300"/>
    <path d="M910 486 V356"/>
  </g>
  <g fill="#2fd08a" opacity=".5">
    <circle cx="392" cy="330" r="2.6"/>
    <circle cx="652" cy="300" r="2.6"/>
    <circle cx="910" cy="356" r="2.6"/>
  </g>

  <!-- Signal sweep -->
  <path d="M-40 404 Q 600 196 1240 404" stroke="url(#arc)" stroke-width="1.6" fill="none"/>

  <!-- Pixel scatter, echoing the DigiBizz logo mark -->
  <g>
    <rect x="1042" y="150" width="26" height="26" rx="6" fill="#f3a93a" opacity=".85"/>
    <rect x="1092" y="196" width="15" height="15" rx="4" fill="#2fd08a" opacity=".7"/>
    <rect x="1062" y="214" width="10" height="10" rx="3" fill="#f3a93a" opacity=".55"/>
    <rect x="1124" y="138" width="9" height="9" rx="3" fill="#ffffff" opacity=".35"/>
    <rect x="236" y="286" width="18" height="18" rx="5" fill="#2fd08a" opacity=".45"/>
    <rect x="202" y="328" width="10" height="10" rx="3" fill="#1fb4c4" opacity=".5"/>
    <rect x="524" y="214" width="12" height="12" rx="4" fill="#b35cf0" opacity=".45"/>
    <rect x="760" y="268" width="9" height="9" rx="3" fill="#2fd08a" opacity=".5"/>
  </g>
</svg>
