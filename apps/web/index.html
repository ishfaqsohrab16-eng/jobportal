<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DigiBizz Jobs — Jobs, internships, programs & trainings</title>
    <meta name="description" content="Find IT jobs, internships, programs and trainings across Balochistan and Pakistan. A DigiBizz Balochistan initiative." />
    <meta name="theme-color" content="#0B1210" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Dark is the house style; apply a saved choice before first paint to avoid a flash.
      document.documentElement.dataset.theme = "dark";
      try {
        var t = localStorage.getItem("dbj-theme");
        if (t === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
